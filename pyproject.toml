[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stackforge"
version = "0.1.0"
description = "Full-colour multi-toolhead 3D printing: per-pixel filament stacks, surface colouring, filament calibration"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
# The CLIs need only these. The Qt GUI (stackforge) is the `gui` extra.
dependencies = ["numpy", "Pillow", "scipy"]

[project.optional-dependencies]
gui = ["PySide6"]
dev = ["pytest", "ruff", "PySide6"]

[project.scripts]
stackforge = "stackforge.gui.app:main"
stackforge-plaque = "stackforge.tools.plaque:main"
stackforge-paint = "stackforge.tools.paint:main"
stackforge-top-paint = "stackforge.tools.top_paint:main"
stackforge-calibrate = "stackforge.tools.calibrate:main"
stackforge-measure = "stackforge.tools.measure:main"
stackforge-filaments = "stackforge.core.filamentdb:main"
stackforge-polymaker = "stackforge.tools.polymaker:main"
stackforge-dither-compare = "stackforge.tools.dither_compare:main"
stackforge-make-samples = "stackforge.tools.make_samples:main"

[tool.setuptools.packages.find]
where = ["src"]

# the shipped filament database and Polymaker catalogue (src/stackforge/data/)
[tool.setuptools.package-data]
stackforge = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# real mistakes only (pyflakes + pycodestyle errors); the codebase's style is not enforced
select = ["E4", "E7", "E9", "F"]
ignore = ["E401", "E402"]   # tests import after setting sys.path / ROOT
