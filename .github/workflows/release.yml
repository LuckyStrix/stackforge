name: release
# Push a tag (git tag v0.1.0 && git push origin v0.1.0): builds the app on each OS with
# packaging/stackforge.spec and attaches the files to a GitHub release for that tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: stackforge-windows.exe
          - os: ubuntu-22.04          # oldest glibc we build on = oldest it runs on
            asset: stackforge-linux
          - os: macos-latest
            asset: stackforge-macos.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[gui,release]"
      - run: pyinstaller --noconfirm packaging/stackforge.spec
      - name: rename
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) mv dist/stackforge.exe "${{ matrix.asset }}" ;;
            Linux)   mv dist/stackforge "${{ matrix.asset }}" ;;
            macOS)   ditto -c -k --keepParent dist/stackforge.app "${{ matrix.asset }}" ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" stackforge-* --repo "${{ github.repository }}" --generate-notes
